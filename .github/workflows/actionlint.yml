name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@4b37bf2261e6208f77520bc3719a8f8b9653e551 # main
    permissions:
      contents: read
      pull-requests: write