name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@672aa7567d97943087954938e9fdce6658f36917 # main
    permissions:
      contents: read
      pull-requests: write