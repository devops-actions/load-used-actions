name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@d364c735203f99cf570835e235fc73e82cd170a5 # main
    permissions:
      contents: read
      pull-requests: write