name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@5e1e286077541a5a9a984dbd52df15ba382ca025 # main
    permissions:
      contents: read
      pull-requests: write