name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@4b37bf2261e6208f77520bc3719a8f8b9653e551 # main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
