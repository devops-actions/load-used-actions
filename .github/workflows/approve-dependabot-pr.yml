name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@672aa7567d97943087954938e9fdce6658f36917 # main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
